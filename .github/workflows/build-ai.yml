name: Build self-hosted AI assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ai.yml"

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install AI files
        run: |
          set -eux
          npm init -y

          npm install \
            @tensorflow/tfjs@4.22.0 \
            @tensorflow-models/body-pix@2.2.1

          mkdir -p vendor

          cp node_modules/@tensorflow/tfjs/dist/tf.min.js \
            vendor/tf.min.js

          BODYPIX=$(find node_modules/@tensorflow-models/body-pix \
            -type f \( -name "body-pix.min.js" -o -name "body-pix.js" -o -name "body_pix.js" \) \
            | head -n 1)

          test -n "$BODYPIX"

          cp "$BODYPIX" vendor/body-pix.min.js

          test -s vendor/tf.min.js
          test -s vendor/body-pix.min.js

      - name: Save AI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/

          if git diff --cached --quiet; then
            echo "AI files already exist"
          else
            git commit -m "Build self-hosted AI assets"
            git push
          fi
