name: Build self-hosted AI assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ai.yml"

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build AI files
        run: |
          set -eux

          npm init -y

          npm install \
            @tensorflow/tfjs@4.22.0 \
            @tensorflow-models/body-pix@2.2.1 \
            esbuild@0.25.9

          mkdir -p vendor

          cp node_modules/@tensorflow/tfjs/dist/tf.min.js \
            vendor/tf.min.js

          cat > bodypix-entry.js <<'EOF'
          import * as bodyPix from '@tensorflow-models/body-pix';
          window.bodyPix = bodyPix;
          EOF

          npx esbuild bodypix-entry.js \
            --bundle \
            --minify \
            --platform=browser \
            --format=iife \
            --external:@tensorflow/tfjs \
            --outfile=vendor/body-pix.min.js

          test -s vendor/tf.min.js
          test -s vendor/body-pix.min.js

          ls -lh vendor/

      - name: Save AI files
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/

          if git diff --cached --quiet; then
            echo "AI files already exist"
          else
            git commit -m "Build self-hosted AI assets"
            git push
          fi
