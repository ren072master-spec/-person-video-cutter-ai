<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>ひとり切り抜き</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}.wrap{max-width:720px;margin:auto;padding:24px 16px 60px}h1{font-size:34px;margin:8px 0}.sub,.note,.status{color:#666;line-height:1.6}.card{background:#fff;border-radius:22px;padding:17px;box-shadow:0 8px 30px #0000000b;margin:14px 0}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:16px;font-weight:800;background:#111;color:#fff}.secondary{background:#e9e9ee;color:#111}.btn:disabled{opacity:.35}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}input[type=file]{display:none}.stage{position:relative;display:none;background:#000;border-radius:14px;overflow:hidden}.stage video{display:block;width:100%;height:auto}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent}.pill{display:inline-block;background:#e8e8ed;padding:7px 10px;border-radius:999px;font-size:13px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#111}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.settings label{font-size:12px;color:#666}.settings select{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:16px}.preview{display:none;margin-top:14px}.checker{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:14px;overflow:hidden}.preview canvas{width:100%;display:block}.good{color:#137333}.warn{color:#9a6700}.tiny{font-size:12px}</style></head><body><div class="wrap"><span class="pill">iPhone Safari対応・AI人物切り抜き v6</span><h1>ひとり切り抜き</h1><p class="sub">動画から指定した1人の輪郭だけをAIで抜きます。追跡クロップではなく、背景と他の人物を消す方式です。</p><div class="card"><label class="btn" for="file">① 動画を選ぶ</label><input id="file" type="file" accept="video/*"><p id="status" class="status">AIモデルを読み込み中…</p><div class="progress"><i id="bar"></i></div></div><div class="card" id="work" style="display:none"><div class="stage" id="stage"><video id="video" controls playsinline webkit-playsinline preload="auto"></video><canvas id="overlay"></canvas></div><p class="note">② 切り抜きたい人が見える位置で一時停止 →「人物を指定」→その人をタップ。</p><div class="row"><button class="btn secondary" id="pick">人物を指定</button><button class="btn secondary" id="reset">リセット</button></div><div class="settings"><label>背景<select id="bg"><option value="transparent">透明（対応時）</option><option value="green">グリーン</option><option value="white">白</option><option value="black">黒</option></select></label><label>精度<select id="quality"><option value="0.5">高速</option><option value="0.75" selected>標準</option><option value="1">高精度</option></select></label></div><button class="btn" id="test" style="margin-top:12px" disabled>③ このフレームを切り抜いて確認</button><div class="preview" id="preview"><p><b>切り抜きプレビュー</b></p><div class="checker"><canvas id="cut"></canvas></div></div><button class="btn" id="export" style="margin-top:12px" disabled>④ AIで切り抜き動画を作る</button><p class="note tiny">透明動画はブラウザ/保存先の対応状況に左右されます。透明WebMが使えないiPhoneでは、グリーン背景での書き出しが最も確実です。人物が完全に隠れたり密集すると、別人へ切り替わる場合があります。</p></div><canvas id="out" style="display:none"></canvas></div><script>
const $=s=>document.querySelector(s),file=$('#file'),v=$('#video'),stage=$('#stage'),ov=$('#overlay'),octx=ov.getContext('2d'),cut=$('#cut'),cctx=cut.getContext('2d'),out=$('#out'),ctx=out.getContext('2d'),status=$('#status'),bar=$('#bar'),work=$('#work'),pick=$('#pick'),reset=$('#reset'),test=$('#test'),exp=$('#export'),preview=$('#preview'),bg=$('#bg'),quality=$('#quality');let net,target=null,selecting=false,running=false,objURL=null;
function loadScript(src,timeout=20000){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';let done=false;const t=setTimeout(()=>{if(!done){done=true;s.remove();ng(new Error('timeout '+src))}},timeout);s.onload=()=>{if(!done){done=true;clearTimeout(t);ok()}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);s.remove();ng(new Error('load '+src))}};document.head.appendChild(s)})}
async function loadAny(urls,label){let err;for(const u of urls){try{status.textContent=label+'を読み込み中…';await loadScript(u);return}catch(e){err=e}}throw err}
async function initAI(){try{bar.style.width='8%';if(!window.tf)await loadAny(['https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js','https://unpkg.com/@tensorflow/tfjs@3.21.0/dist/tf.min.js'],'AIエンジン');bar.style.width='30%';await tf.ready();if(!window.bodyPix)await loadAny(['https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.1/dist/body-pix.min.js','https://unpkg.com/@tensorflow-models/body-pix@2.2.1/dist/body-pix.min.js'],'人物切り抜きAI');bar.style.width='55%';status.textContent='人物切り抜きモデルを準備中…（初回は少し時間がかかります）';net=await bodyPix.load({architecture:'MobileNetV1',outputStride:16,multiplier:.50,quantBytes:2});bar.style.width='100%';status.innerHTML='<span class="good">AI準備完了。</span> 動画を選んでください。';file.disabled=false}catch(e){console.error(e);bar.style.width='0%';status.innerHTML='<span class="warn">AIの読み込みに失敗しました。</span><br><button id="retry" class="btn secondary" style="margin-top:10px">AIを再読み込み</button><br><span class="tiny">通信を確認して再試行してください。エラー: '+String(e.message||e).replace(/[<>]/g,'')+'</span>';document.getElementById('retry').onclick=initAI}}
file.disabled=true;initAI();
file.onchange=()=>{const f=file.files[0];if(!f)return;if(objURL)URL.revokeObjectURL(objURL);objURL=URL.createObjectURL(f);v.src=objURL;v.load();work.style.display='block';stage.style.display='block';target=null;test.disabled=exp.disabled=true;status.textContent='動画を読み込み中…'};
function ready(){if(!v.videoWidth)return;ov.width=v.videoWidth;ov.height=v.videoHeight;stage.style.aspectRatio=v.videoWidth+'/'+v.videoHeight;status.textContent='動画を読み込みました。人物が見える位置で止めてください。';try{if(v.currentTime===0)v.currentTime=Math.min(.05,v.duration||.05)}catch(e){}}v.addEventListener('loadedmetadata',ready);v.addEventListener('loadeddata',ready);v.addEventListener('error',()=>status.textContent='この動画をSafariで読み込めませんでした。');
pick.onclick=()=>{if(!net)return alert('AI準備中です');v.pause();selecting=true;status.textContent='切り抜きたい人物をタップしてください。'};
function bboxFromMask(seg){let minX=seg.width,minY=seg.height,maxX=-1,maxY=-1,n=0,d=seg.data;for(let y=0;y<seg.height;y++)for(let x=0;x<seg.width;x++){if(d[y*seg.width+x]){n++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}return n?{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1,cx:(minX+maxX)/2,cy:(minY+maxY)/2,area:n}:null}
async function segments(){return await net.segmentMultiPerson(v,{flipHorizontal:false,internalResolution:+quality.value,segmentationThreshold:.65,maxDetections:10,scoreThreshold:.2,nmsRadius:20})}
v.onclick=async e=>{if(!selecting||running)return;status.textContent='人物の輪郭を解析中…';const r=v.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*v.videoWidth,y=(e.clientY-r.top)/r.height*v.videoHeight;try{const ss=await segments();const cand=ss.map((s,i)=>({s,b:bboxFromMask(s),i})).filter(z=>z.b);let z=cand.find(z=>x>=z.b.x&&x<=z.b.x+z.b.w&&y>=z.b.y&&y<=z.b.y+z.b.h);if(!z)z=cand.sort((a,b)=>Math.hypot(a.b.cx-x,a.b.cy-y)-Math.hypot(b.b.cx-x,b.b.cy-y))[0];if(!z)throw 0;target={...z.b,seg:z.s};drawBox(target);selecting=false;test.disabled=exp.disabled=false;status.textContent='人物を指定しました。まず切り抜きプレビューを確認してください。'}catch(e){status.textContent='人物を検出できませんでした。別の場面で試してください。'}};
function drawBox(t){octx.clearRect(0,0,ov.width,ov.height);if(!t)return;octx.strokeStyle='#ff3b30';octx.lineWidth=Math.max(4,ov.width/180);octx.strokeRect(t.x,t.y,t.w,t.h)}
function fillBackground(g,w,h){g.clearRect(0,0,w,h);if(bg.value==='green'){g.fillStyle='#00ff00';g.fillRect(0,0,w,h)}else if(bg.value==='white'){g.fillStyle='#fff';g.fillRect(0,0,w,h)}else if(bg.value==='black'){g.fillStyle='#000';g.fillRect(0,0,w,h)}}
function renderMask(seg,dest,dctx){dest.width=v.videoWidth;dest.height=v.videoHeight;fillBackground(dctx,dest.width,dest.height);const tmp=document.createElement('canvas');tmp.width=dest.width;tmp.height=dest.height;const tg=tmp.getContext('2d');tg.drawImage(v,0,0,tmp.width,tmp.height);const img=tg.getImageData(0,0,tmp.width,tmp.height),m=seg.data;for(let i=0;i<m.length;i++)if(!m[i])img.data[i*4+3]=0;tg.putImageData(img,0,0);dctx.drawImage(tmp,0,0)}
test.onclick=async()=>{if(!target)return;status.textContent='切り抜き中…';const ss=await segments();const best=match(ss,target);if(!best){status.textContent='指定人物を見つけられませんでした。';return}target={...best.b,seg:best.s};renderMask(best.s,cut,cctx);preview.style.display='block';drawBox(target);status.textContent='プレビューを確認してください。輪郭が良ければ動画を書き出せます。'};
function match(ss,prev){let arr=ss.map(s=>({s,b:bboxFromMask(s)})).filter(z=>z.b);return arr.map(z=>{const d=Math.hypot(z.b.cx-prev.cx,z.b.cy-prev.cy),size=Math.abs(Math.log((z.b.area+1)/(prev.area+1)));return{...z,score:d+size*180}}).sort((a,b)=>a.score-b.score)[0]}
reset.onclick=()=>{target=null;selecting=false;test.disabled=exp.disabled=true;preview.style.display='none';octx.clearRect(0,0,ov.width,ov.height);status.textContent='リセットしました。'};
exp.onclick=async()=>{if(!target||running)return;let candidates=bg.value==='transparent'?['video/webm;codecs=vp9','video/webm']:['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm'];let mime=candidates.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x));if(!mime){alert('このSafariではブラウザ内動画書き出しに対応していません。');return}if(bg.value==='transparent'&&!mime.includes('webm')){alert('この端末では透明動画を書き出せません。背景を「グリーン」にすると確実です。');return}running=true;exp.disabled=pick.disabled=test.disabled=true;v.controls=false;out.width=v.videoWidth;out.height=v.videoHeight;const stream=out.captureStream(24),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6_000_000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=mime.includes('webm')?'hitori-cutout.webm':'hitori-cutout.mp4';a.click();running=false;exp.disabled=pick.disabled=test.disabled=false;v.controls=true;status.textContent='完成しました。ファイルを保存してください。'};v.currentTime=0;v.muted=true;await new Promise(r=>v.addEventListener('seeked',r,{once:true}));await v.play();rec.start(1000);let last=0,current=target.seg;async function loop(t){if(v.ended){rec.stop();return}if(t-last>180){last=t;try{const ss=await segments(),best=match(ss,target);if(best){target={...best.b,seg:best.s};current=best.s;drawBox(target)}}catch(e){}}if(current)renderMask(current,out,ctx);bar.style.width=Math.min(100,v.currentTime/v.duration*100)+'%';status.textContent='AI切り抜き中… '+Math.round(v.currentTime/v.duration*100)+'%';requestAnimationFrame(loop)}requestAnimationFrame(loop)};
</script></body></html>
