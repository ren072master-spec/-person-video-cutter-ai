<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ひとり切り抜き v11</title>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111}.w{max-width:720px;margin:auto;padding:24px}.c{background:#fff;padding:22px;border-radius:25px;margin:16px 0}h1{font-size:42px}button,input,select{font-size:17px;padding:15px;width:100%;margin:8px 0}button{border:0;border-radius:16px;font-weight:800}.stage{position:relative;background:#000;border-radius:18px;overflow:hidden}.stage video{display:block;width:100%;height:auto;min-height:260px;background:#000;object-fit:contain}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hide{display:none}.ok{color:green}.bad{color:#a50}#result{width:100%;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 50%/24px 24px;border-radius:18px}.diag{font-size:12px;white-space:pre-wrap;color:#666}</style></head>
<body><main class=w><small>iPhone Safari対応・自己ホストAI v11</small><h1>ひとり切り抜き</h1>
<div class=c><h2>① AI</h2><p id=st>読み込み中…</p></div>
<div class=c><h2>② 動画</h2><input id=f type=file accept="video/*,video/quicktime"><div id=m class=hide><div class=stage><video id=v controls playsinline webkit-playsinline preload="auto"></video><canvas id=o></canvas></div><p id=hint>中央の再生ボタンで再生し、人物が見える位置で停止してください。</p><button id=p>人物を指定</button><pre id=d class=diag></pre></div></div>
<div id=cc class="c hide"><h2>③ 切り抜き</h2><select id=bg><option value=transparent>背景透明</option><option value=green>グリーン</option><option value=white>白</option><option value=black>黒</option></select><button id=go>このフレームをAI切り抜き</button><canvas id=r></canvas><p id=msg></p></div></main>
<script>
const $=q=>document.querySelector(q),st=$('#st'),f=$('#f'),v=$('#v'),o=$('#o'),r=$('#r'),d=$('#d');let net,pt,url;
function js(src){return new Promise((a,b)=>{let x=document.createElement('script');x.src=src+'?v=10';x.onload=a;x.onerror=()=>b(Error('読込失敗 '+src));document.head.appendChild(x)})}
async function boot(){try{if(!window.tf)await js('./vendor/tf.min.js');if(!window.bodyPix)await js('./vendor/body-pix.min.js');await tf.ready();st.textContent='AI準備OK ✓';st.className='ok'}catch(e){st.textContent='AI読込失敗: '+e.message;st.className='bad'}}
function diag(x){d.textContent+=x+'\n'}
f.onchange=()=>{let file=f.files&&f.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);$('#m').classList.remove('hide');d.textContent='';diag(file.name+' / '+(file.type||'type不明')+' / '+(file.size/1048576).toFixed(1)+'MB');v.pause();v.removeAttribute('src');v.load();v.src=url;v.muted=false;v.defaultMuted=false;v.load();setTimeout(()=>{try{v.currentTime=Math.min(.05,v.duration||.05)}catch(e){}},300)};
['loadedmetadata','loadeddata','canplay','playing','pause','error'].forEach(ev=>v.addEventListener(ev,()=>{diag(ev+' readyState='+v.readyState+' '+(v.videoWidth?`${v.videoWidth}x${v.videoHeight}`:''));if(ev==='loadedmetadata'){o.width=r.width=v.videoWidth;o.height=r.height=v.videoHeight}}));
p.onclick=()=>{o.style.pointerEvents='auto';p.textContent='残したい人物の胴体をタップ'};
o.onclick=e=>{let b=o.getBoundingClientRect();pt={x:(e.clientX-b.left)/b.width*o.width,y:(e.clientY-b.top)/b.height*o.height};let c=o.getContext('2d');c.clearRect(0,0,o.width,o.height);c.strokeStyle='#ff3b30';c.lineWidth=Math.max(4,o.width/200);c.beginPath();c.arc(pt.x,pt.y,Math.max(25,o.width/35),0,Math.PI*2);c.stroke();o.style.pointerEvents='none';p.textContent='指定済み（変更する）';cc.classList.remove('hide')};
go.onclick=async()=>{try{msg.textContent='輪郭を解析中…';if(!net)net=await bodyPix.load({architecture:'MobileNetV1',outputStride:16,multiplier:1.0,quantBytes:2});let people=await net.segmentMultiPerson(v,{internalResolution:'high',segmentationThreshold:.62,maxDetections:10,scoreThreshold:.2,nmsRadius:20}),w=v.videoWidth,h=v.videoHeight,tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;let tc=tmp.getContext('2d');tc.drawImage(v,0,0,w,h);let src=tc.getImageData(0,0,w,h),ctx=r.getContext('2d'),im=ctx.createImageData(w,h),b=bg.value;if(!people.length)throw Error('人物を検出できませんでした');let px=Math.max(0,Math.min(w-1,Math.round(pt.x))),py=Math.max(0,Math.min(h-1,Math.round(pt.y))),pi=py*w+px;let chosenSeg=people.find(s=>s.data[pi]);if(!chosenSeg){let best=null,bestD=1e30;for(const s of people){let sx=0,sy=0,n=0,step=Math.max(1,Math.floor(w/180));for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){if(s.data[y*w+x]){sx+=x;sy+=y;n++}}if(n){let dx=sx/n-px,dy=sy/n-py,dd=dx*dx+dy*dy;if(dd<bestD){bestD=dd;best=s}}}chosenSeg=best}if(!chosenSeg)throw Error('指定した人物を判定できませんでした');ctx.clearRect(0,0,w,h);if(b!='transparent'){ctx.fillStyle=b=='green'?'#00ff00':b;ctx.fillRect(0,0,w,h)}for(let i=0;i<chosenSeg.data.length;i++)if(chosenSeg.data[i]){im.data[i*4]=src.data[i*4];im.data[i*4+1]=src.data[i*4+1];im.data[i*4+2]=src.data[i*4+2];im.data[i*4+3]=255}ctx.putImageData(im,0,0);msg.textContent='指定した1人だけ切り抜きました ✓（検出人数: '+people.length+'）'}catch(e){msg.textContent='切り抜きエラー: '+e.message}};
boot();
</script></body></html>
