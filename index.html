<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひとり切り抜き v8</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111}.wrap{max-width:760px;margin:auto;padding:28px 20px}h1{font-size:42px}.card{background:#fff;border-radius:28px;padding:22px;margin:18px 0}button{border:0;border-radius:18px;padding:18px;font-weight:800;font-size:17px;width:100%}video,canvas{width:100%;border-radius:20px;background:#000}.status{line-height:1.6;color:#555}.ok{color:#087a35}.bad{color:#a35b00}</style></head>
<body><main class="wrap"><small>iPhone Safari対応・自己ホストAI v8</small><h1>ひとり切り抜き</h1>
<div class="card"><h2>① AIを確認</h2><p id="status" class="status">AIファイルを確認中…</p>
<button id="retry">AIを読み込む</button></div>
<div class="card"><h2>② 動画を選ぶ</h2><input id="file" type="file" accept="video/*" disabled><br><br><video id="video" controls playsinline></video>
<p>このv8は外部CDNからJavaScriptを直接読むのではなく、GitHub Actionsが <code>vendor/</code> にAIライブラリを保存してからPagesへ公開します。</p></div>
</main>
<script>
const s=document.querySelector('#status'), f=document.querySelector('#file'), v=document.querySelector('#video');
function script(src){return new Promise((ok,no)=>{let x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=()=>no(new Error(src));document.head.appendChild(x)})}
async function boot(){
 s.textContent='GitHub Pages内のAIファイルを読み込み中…'; s.className='status';
 try{
  await script('./vendor/tf.min.js');
  await script('./vendor/body-pix.min.js');
  if(!window.tf||!window.bodyPix) throw Error('AIライブラリが見つかりません');
  s.textContent='AIライブラリ準備OK。動画を選べます。';s.className='status ok';f.disabled=false;
 }catch(e){s.textContent='AIファイルがまだ生成されていません。GitHub Actions「Build self-hosted AI assets」を実行してください。\n'+e.message;s.className='status bad';}
}
document.querySelector('#retry').onclick=boot;
f.onchange=()=>{if(f.files[0]){v.src=URL.createObjectURL(f.files[0]);v.load()}};
boot();
</script></body></html>
