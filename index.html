<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>ひとり追跡</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}.wrap{max-width:720px;margin:auto;padding:24px 16px 60px}h1{font-size:32px;margin:8px 0}.sub,.note,.status{color:#666;line-height:1.55}.card{background:#fff;border-radius:22px;padding:17px;box-shadow:0 8px 30px #0000000b;margin:14px 0}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:16px;font-weight:750;background:#111;color:#fff}.secondary{background:#e9e9ee;color:#111}.btn:disabled{opacity:.35}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}input[type=file]{display:none}video,canvas{width:100%;border-radius:14px;background:#000}.stage{position:relative;display:none}.stage canvas{position:absolute;inset:0;height:100%;pointer-events:none}.pill{display:inline-block;background:#e8e8ed;padding:7px 10px;border-radius:999px;font-size:13px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#111}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.settings label{font-size:12px;color:#666}.settings select{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:16px}.good{color:#137333}</style></head><body><div class="wrap"><span class="pill">iPhone Safari対応・AI追跡 MVP</span><h1>ひとり追跡</h1><p class="sub">動画の人物をタップすると、AIが人物を検出しながら追いかけ、指定した人を中心にした動画を書き出します。処理はブラウザ内で行います。</p><div class="card"><label class="btn" for="file">① 動画を選ぶ</label><input id="file" type="file" accept="video/*"><p id="status" class="status">最初にAIモデルを読み込みます。</p><div class="progress"><i id="bar"></i></div></div><div class="card" id="work" style="display:none"><div class="stage" id="stage"><video id="video" controls playsinline></video><canvas id="overlay"></canvas></div><p class="note">② 残したい人物が見えるところで一時停止し、「人物を指定」→その人をタップしてください。</p><div class="row"><button class="btn secondary" id="pick">人物を指定</button><button class="btn secondary" id="reset">リセット</button></div><div class="settings"><label>出力比率<select id="ratio"><option value="9/16">縦 9:16</option><option value="1/1">正方形 1:1</option><option value="16/9">横 16:9</option></select></label><label>追跡範囲<select id="zoom"><option value="0.42">近め</option><option value="0.58" selected>標準</option><option value="0.75">広め</option></select></label></div><button class="btn" id="export" style="margin-top:12px" disabled>③ AI追跡して動画を作る</button><p class="note">人物が完全に隠れた場合は直前の位置を保持します。同じ服装の人が密集する動画では追跡が入れ替わることがあります。</p></div><canvas id="out" style="display:none"></canvas></div><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script><script>
const $=s=>document.querySelector(s),file=$('#file'),v=$('#video'),stage=$('#stage'),ov=$('#overlay'),octx=ov.getContext('2d'),out=$('#out'),ctx=out.getContext('2d'),status=$('#status'),bar=$('#bar'),work=$('#work'),pick=$('#pick'),reset=$('#reset'),exp=$('#export'),ratio=$('#ratio'),zoom=$('#zoom');let model,target=null,selecting=false,running=false,lastDetect=0;
(async()=>{try{status.textContent='AIモデルを読み込み中…';bar.style.width='25%';await tf.ready();model=await cocoSsd.load({base:'lite_mobilenet_v2'});bar.style.width='100%';status.innerHTML='<span class="good">AI準備完了。</span> 動画を選んでください。'}catch(e){status.textContent='AIの読み込みに失敗しました。通信を確認して再読み込みしてください。'}})();
file.onchange=()=>{if(!file.files[0])return;v.src=URL.createObjectURL(file.files[0]);work.style.display='block';stage.style.display='block';target=null;exp.disabled=true;status.textContent='動画を読み込みました。人物が見える位置で止めてください。'};
v.onloadedmetadata=()=>{ov.width=v.videoWidth;ov.height=v.videoHeight};
pick.onclick=()=>{if(!model)return alert('AIモデルの準備中です');v.pause();selecting=true;status.textContent='残したい人物を動画上でタップしてください。'};
v.onclick=async e=>{if(!selecting||running)return;const r=v.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*v.videoWidth,y=(e.clientY-r.top)/r.height*v.videoHeight;status.textContent='人物を確認中…';const ps=(await model.detect(v)).filter(p=>p.class==='person'&&p.score>.35);target=ps.filter(p=>x>=p.bbox[0]&&x<=p.bbox[0]+p.bbox[2]&&y>=p.bbox[1]&&y<=p.bbox[1]+p.bbox[3]).sort((a,b)=>b.score-a.score)[0]||ps.sort((a,b)=>distBox(a,x,y)-distBox(b,x,y))[0];selecting=false;if(!target){status.textContent='人物を検出できませんでした。別の場面で試してください。';return}drawTarget(target);exp.disabled=false;status.textContent='人物を指定しました。AI追跡を開始できます。'};
function distBox(p,x,y){let [a,b,w,h]=p.bbox;return Math.hypot(a+w/2-x,b+h/2-y)}function center(p){return{x:p.bbox[0]+p.bbox[2]/2,y:p.bbox[1]+p.bbox[3]/2}}
function drawTarget(p){octx.clearRect(0,0,ov.width,ov.height);if(!p)return;octx.strokeStyle='#ff3b30';octx.lineWidth=Math.max(4,ov.width/180);octx.strokeRect(...p.bbox)}
reset.onclick=()=>{target=null;selecting=false;exp.disabled=true;octx.clearRect(0,0,ov.width,ov.height);status.textContent='リセットしました。'};
async function updateTarget(){const ps=(await model.detect(v)).filter(p=>p.class==='person'&&p.score>.28);if(!ps.length)return;const c=center(target);let best=ps.map(p=>{const q=center(p),d=Math.hypot(q.x-c.x,q.y-c.y),size=Math.abs(Math.log((p.bbox[2]*p.bbox[3]+1)/(target.bbox[2]*target.bbox[3]+1)));return{p,s:d+size*180}}).sort((a,b)=>a.s-b.s)[0];const limit=Math.max(v.videoWidth,v.videoHeight)*.32;if(best&&best.s<limit)target=best.p}
exp.onclick=async()=>{if(!target||running)return;const mime=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)return alert('このSafariでは動画書き出しに対応していません。iOSを最新版にしてお試しください。');running=true;exp.disabled=true;pick.disabled=true;v.controls=false;const [rw,rh]=ratio.value.split('/').map(Number),scale=+zoom.value;let H=Math.round(v.videoHeight*scale),W=Math.round(H*rw/rh);if(W>v.videoWidth){W=Math.round(v.videoWidth*scale);H=Math.round(W*rh/rw)}out.width=W;out.height=H;const stream=out.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5_000_000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=mime.includes('mp4')?'hitori-tracked.mp4':'hitori-tracked.webm';a.click();running=false;exp.disabled=false;pick.disabled=false;v.controls=true;status.textContent='完成しました。ファイルを保存してください。'};v.currentTime=0;v.muted=true;await new Promise(r=>v.onseeked=()=>r());await v.play();rec.start(1000);let smooth=center(target);async function frame(t){if(v.ended){rec.stop();return}if(t-lastDetect>220){lastDetect=t;try{await updateTarget()}catch(e){}}const c=center(target);smooth.x=smooth.x*.82+c.x*.18;smooth.y=smooth.y*.82+c.y*.18;let sx=Math.max(0,Math.min(v.videoWidth-W,smooth.x-W/2)),sy=Math.max(0,Math.min(v.videoHeight-H,smooth.y-H/2));ctx.drawImage(v,sx,sy,W,H,0,0,W,H);drawTarget(target);bar.style.width=Math.min(100,v.currentTime/v.duration*100)+'%';status.textContent='AI追跡中… '+Math.round(v.currentTime/v.duration*100)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame)};
</script></body></html>
